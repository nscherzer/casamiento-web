<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julia & Nico · 9.10.2027</title>
<meta name="description" content="Julia & Nico se casan · Buenos Aires, 9 de octubre de 2027">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1ea;
    --ink: #2f3a2f;
    --muted: #6f776b;
    --accent: #9a7b4f;
    --line: #d9cfbf;
    --card: #fffdf9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lang {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; gap: 2px;
    background: rgba(255,253,249,.85); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px;
  }
  .lang button {
    border: 0; background: none; cursor: pointer;
    font: 500 12px/1 "Jost", sans-serif; letter-spacing: .12em;
    color: var(--muted); padding: 8px 12px; border-radius: 999px;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  main {
    width: 100%; max-width: 760px;
    padding: 72px 16px 48px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .kicker {
    font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent);
  }
  h1 {
    font-family: "Cormorant Garamond", serif; font-weight: 400;
    font-size: clamp(56px, 13vw, 104px); line-height: 1; margin: 18px 0 10px;
  }
  h1 .amp { font-style: italic; color: var(--accent); padding: 0 .08em; }
  .date {
    font-family: "Cormorant Garamond", serif; font-size: clamp(22px, 5vw, 30px);
    letter-spacing: .04em;
  }
  .place { color: var(--muted); margin-top: 6px; letter-spacing: .08em; }

  .photo {
    margin: 40px 0; width: 100%; aspect-ratio: 4 / 5; max-width: 460px;
    border-radius: 999px 999px 18px 18px; overflow: hidden;
    border: 1px solid var(--line); background: var(--card);
    position: relative;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 72px; color: var(--accent);
    background: radial-gradient(circle at 50% 35%, #fffdf9 0%, #efe6d8 100%);
  }

  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 520px; }
  .unit {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 4px 14px;
  }
  .num {
    font-family: "Cormorant Garamond", serif; font-weight: 500;
    font-size: clamp(30px, 8vw, 48px); line-height: 1; font-variant-numeric: tabular-nums;
  }
  .lbl { margin-top: 8px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .until { margin: 0 0 14px; color: var(--muted); letter-spacing: .06em; }

  .note {
    margin-top: 44px; max-width: 520px; line-height: 1.7; font-size: 17px;
  }
  .divider { width: 48px; height: 1px; background: var(--accent); margin: 44px auto 0; }
  footer { padding: 28px 16px 40px; color: var(--muted); font-size: 13px; letter-spacing: .08em; }
</style>
</head>
<body>
  <nav class="lang" aria-label="Idioma / Sprache">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="de" aria-pressed="false">DE</button>
  </nav>

  <main>
    <p class="kicker" data-i18n="kicker">Nos casamos</p>
    <h1>Julia <span class="amp">&amp;</span> Nico</h1>
    <p class="date" data-i18n="date">9 de octubre de 2027</p>
    <p class="place">Buenos Aires · Argentina</p>

    <figure class="photo">
      <div class="fallback">J &amp; N</div>
      <img src="foto.jpg" alt="Julia y Nico" onerror="this.remove()">
    </figure>

    <p class="until" data-i18n="until">Faltan</p>
    <div class="countdown" role="timer" aria-live="off">
      <div class="unit"><div class="num" id="d">–</div><div class="lbl" data-i18n="days">días</div></div>
      <div class="unit"><div class="num" id="h">–</div><div class="lbl" data-i18n="hours">horas</div></div>
      <div class="unit"><div class="num" id="m">–</div><div class="lbl" data-i18n="minutes">min</div></div>
      <div class="unit"><div class="num" id="s">–</div><div class="lbl" data-i18n="seconds">seg</div></div>
    </div>

    <p class="note" data-i18n="note">Guardate la fecha. Muy pronto vas a recibir la invitación con todos los detalles.</p>
    <div class="divider"></div>
  </main>

  <footer>J &amp; N · 09.10.2027</footer>

<script>
  // 9 de octubre de 2027, 00:00 en Buenos Aires (UTC-3). Cambiar acá cuando esté la hora.
  const TARGET = new Date("2027-10-09T00:00:00-03:00");

  const T = {
    es: {
      kicker: "Nos casamos", date: "9 de octubre de 2027", until: "Faltan",
      days: "días", hours: "horas", minutes: "min", seconds: "seg",
      note: "Guardate la fecha. Muy pronto vas a recibir la invitación con todos los detalles.",
      done: "¡Hoy es el día!", alt: "Julia y Nico"
    },
    de: {
      kicker: "Wir heiraten", date: "9. Oktober 2027", until: "Noch",
      days: "Tage", hours: "Stunden", minutes: "Min.", seconds: "Sek.",
      note: "Haltet euch den Termin frei. Die Einladung mit allen Details folgt bald.",
      done: "Heute ist der Tag!", alt: "Julia und Nico"
    }
  };

  let lang = "es";
  function setLang(l) {
    lang = T[l] ? l : "es";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    const img = document.querySelector(".photo img"); if (img) img.alt = T[lang].alt;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    tick();
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let ms = TARGET - Date.now();
    if (ms <= 0) {
      document.querySelector(".until").textContent = T[lang].done;
      ["d","h","m","s"].forEach(id => document.getElementById(id).textContent = "0");
      return;
    }
    const s = Math.floor(ms / 1000);
    document.getElementById("d").textContent = Math.floor(s / 86400);
    document.getElementById("h").textContent = pad(Math.floor(s % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(s % 3600 / 60));
    document.getElementById("s").textContent = pad(s % 60);
  }

  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  const fromUrl = new URLSearchParams(location.search).get("lang");
  setLang(fromUrl || saved || ((navigator.language || "").toLowerCase().startsWith("de") ? "de" : "es"));
  setInterval(tick, 1000);
</script>
</body>
</html>
