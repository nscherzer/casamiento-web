<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julia y Nico se casan · 9.10.2027</title>
<meta name="description" content="Julia y Nico se casan el 9 de octubre de 2027 en Buenos Aires. Julia und Nico heiraten.">
<meta property="og:title" content="Julia y Nico se casan">
<meta property="og:description" content="9 de octubre de 2027, Buenos Aires">
<meta property="og:image" content="https://nscherzer.github.io/casamiento-web/foto.jpg">
<meta name="theme-color" content="#f3f4f1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2236%22 fill=%22none%22 stroke=%22%23a8603a%22 stroke-width=%2210%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..700&display=swap" rel="stylesheet">
<style>
  /* Sal y cobre: la paleta sale de la foto (sal de las Salinas Grandes, cielo de tormenta, el anillo). */
  :root {
    --salt: #f3f4f1;
    --storm: #232833;
    --slate: #666d7b;
    --haze: #c9ccd3;
    --copper: #a8603a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--salt);
    color: var(--storm);
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 380;
    font-size: 17px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .wide { font-stretch: 125%; font-variation-settings: "wdth" 125; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }

  /* idioma: dos palabras, la activa subrayada en cobre */
  .lang {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 50;
    display: flex; background: var(--salt); border-radius: 3px; padding: 2px 4px;
  }
  .lang button {
    border: 0; background: none; cursor: pointer; color: var(--slate);
    font: 450 14px/1 "Archivo", sans-serif; padding: 8px 8px 7px;
    border-bottom: 1.5px solid transparent;
  }
  .lang button[aria-pressed="true"] { color: var(--storm); border-bottom-color: var(--copper); }

  /* hero: se entra en el anillo */
  .hero { height: 330vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: #c7cad0; }
  .stage img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; will-change: transform; transform-origin: 0 0;
  }
  .veil { position: absolute; inset: 0; pointer-events: none; }
  #halo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .intro {
    position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
    padding: 0 clamp(16px, 5vw, 64px); will-change: opacity, transform;
  }
  .intro h1 {
    font-weight: 260; font-stretch: 125%; font-variation-settings: "wdth" 125;
    font-size: clamp(50px, min(14.5vw, 12vh), 150px); line-height: .9; letter-spacing: -.035em;
  }
  .intro h1 span { display: block; }
  .intro p { margin-top: 18px; font-size: clamp(16px, 2.2vw, 20px); max-width: 34ch; color: var(--storm); }

  .reveal { position: absolute; left: 0; right: 0; text-align: center; padding: 0 16px; opacity: 0; will-change: opacity; }
  .reveal .date {
    font-weight: 300; font-stretch: 125%; font-variation-settings: "wdth" 125;
    font-size: clamp(28px, 6.6vw, 56px); line-height: 1; letter-spacing: -.02em;
  }
  .reveal .place { margin-top: 10px; color: var(--slate); }

  /* cuenta regresiva: tipográfica, sin adornos */
  .count {
    min-height: 100vh; min-height: 100svh;
    padding: 18vh clamp(16px, 5vw, 64px) 14vh;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 1100px; margin: 0 auto;
  }
  .count .date { font-size: clamp(18px, 2.4vw, 22px); }
  .count .until { margin-top: 4px; color: var(--slate); }
  .rows {
    margin-top: 28px; display: grid; grid-template-columns: auto 1fr;
    column-gap: clamp(14px, 2.4vw, 32px); align-items: baseline;
  }
  .rows .n {
    text-align: right; font-weight: 200; font-stretch: 125%; font-variation-settings: "wdth" 125;
    font-size: clamp(64px, 19vw, 190px); line-height: .98; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .rows .u { font-size: clamp(17px, 2.4vw, 24px); color: var(--slate); }
  .rows .cell { display: contents; }
  @media (min-width: 900px) {
    .rows { grid-template-columns: repeat(4, auto); justify-content: start; column-gap: clamp(28px, 4vw, 64px); }
    .rows .cell { display: flex; flex-direction: column; }
    .rows .n { text-align: left; font-size: clamp(64px, 9.5vw, 150px); }
    .rows .u { margin-top: 10px; }
  }
  .rows .n.s { color: var(--copper); }
  .count .note { margin-top: 48px; max-width: 46ch; font-size: clamp(17px, 2vw, 20px); }

  /* cierre */
  .closing { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  .closing img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
  .closing p {
    position: absolute; left: 0; right: 0; bottom: max(36px, env(safe-area-inset-bottom));
    padding: 0 clamp(16px, 5vw, 64px);
    font-weight: 260; font-stretch: 125%; font-variation-settings: "wdth" 125;
    font-size: clamp(36px, 9vw, 96px); line-height: .95; letter-spacing: -.03em; max-width: 14ch;
  }

  footer { padding: 28px clamp(16px, 5vw, 64px) 36px; color: var(--slate); font-size: 14px; display: flex; justify-content: space-between; gap: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .hero { height: 100vh; }
  }
</style>
</head>
<body>
  <nav class="lang" aria-label="Idioma / Sprache">
    <button type="button" data-lang="es" aria-pressed="true">Español</button>
    <button type="button" data-lang="de" aria-pressed="false">Deutsch</button>
  </nav>

  <section class="hero" id="hero">
    <div class="stage" id="stage">
      <img class="bg" id="bg" src="foto.jpg" alt="Julia y Nico" fetchpriority="high">
      <div class="veil" id="veil"></div>
      <svg id="halo" aria-hidden="true"><circle id="haloCircle" cx="0" cy="0" r="0" fill="none" stroke="#a8603a" stroke-width="1.5"/></svg>

      <div class="intro" id="intro">
        <h1><span>Julia</span><span data-i18n="and">y Nico</span><span data-i18n="marry">se casan</span></h1>
        <p data-i18n="when">El 9 de octubre de 2027, en Buenos Aires.</p>
      </div>

      <div class="reveal" id="reveal">
        <p class="date" data-i18n="dateShort">9 de octubre de 2027</p>
        <p class="place">Buenos Aires</p>
      </div>
    </div>
  </section>

  <section class="count" id="count" aria-label="Cuenta regresiva">
    <p class="date" data-i18n="dateLong">Sábado 9 de octubre de 2027</p>
    <p class="until" data-i18n="until">Faltan</p>
    <div class="rows" role="timer">
      <div class="cell"><span class="n" id="d">–</span><span class="u" id="ud"></span></div>
      <div class="cell"><span class="n" id="h">–</span><span class="u" id="uh"></span></div>
      <div class="cell"><span class="n" id="m">–</span><span class="u" id="um"></span></div>
      <div class="cell"><span class="n s" id="s">–</span><span class="u" id="us"></span></div>
    </div>
    <p class="note" data-i18n="note">Reservate la fecha. La invitación con todos los detalles llega más adelante.</p>
  </section>

  <section class="closing">
    <img src="foto2.jpg" alt="Julia y Nico" loading="lazy">
    <p data-i18n="closing">Nos vemos en Buenos Aires.</p>
  </section>

  <footer><span>Julia &amp; Nico</span><span>2027</span></footer>

<script>
  // 9 de octubre de 2027, 00:00 en Buenos Aires (UTC-3). Cambiar acá cuando esté la hora.
  const TARGET = new Date("2027-10-09T00:00:00-03:00");

  // Anillo en foto.jpg (2160x2880): centro y radio exterior, en píxeles de la foto.
  const PHOTO = { w: 2160, h: 2880, cx: 1177, cy: 1243, r: 172 };

  const T = {
    es: {
      and: "y Nico", marry: "se casan", when: "El 9 de octubre de 2027, en Buenos Aires.",
      dateShort: "9 de octubre de 2027", dateLong: "Sábado 9 de octubre de 2027", until: "Faltan",
      units: { d: ["día", "días"], h: ["hora", "horas"], m: ["minuto", "minutos"], s: ["segundo", "segundos"] },
      note: "Reservate la fecha. La invitación con todos los detalles llega más adelante.",
      closing: "Nos vemos en Buenos Aires.", done: "Es hoy.", alt: "Julia y Nico", region: "Cuenta regresiva"
    },
    de: {
      and: "und Nico", marry: "heiraten", when: "Am 9. Oktober 2027 in Buenos Aires.",
      dateShort: "9. Oktober 2027", dateLong: "Samstag, 9. Oktober 2027", until: "Noch",
      units: { d: ["Tag", "Tage"], h: ["Stunde", "Stunden"], m: ["Minute", "Minuten"], s: ["Sekunde", "Sekunden"] },
      note: "Haltet euch den Tag frei. Die Einladung mit allen Details folgt.",
      closing: "Wir sehen uns in Buenos Aires.", done: "Heute ist es so weit.", alt: "Julia und Nico", region: "Countdown"
    }
  };

  /* idioma */
  let lang = "es";
  function setLang(l) {
    lang = T[l] ? l : "es";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    document.querySelectorAll("img").forEach(img => { img.alt = T[lang].alt; });
    document.getElementById("count").setAttribute("aria-label", T[lang].region);
    document.title = (lang === "de" ? "Julia und Nico heiraten" : "Julia y Nico se casan") + " · 9.10.2027";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    countFrame(true);
  }

  /* hero */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hero = document.getElementById("hero"), stage = document.getElementById("stage");
  const bg = document.getElementById("bg"), veil = document.getElementById("veil");
  const intro = document.getElementById("intro"), reveal = document.getElementById("reveal");
  const halo = document.getElementById("haloCircle");
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;

  function heroFrame() {
    const vw = innerWidth, vh = stage.clientHeight;
    const p = reduce ? 0 : clamp(-hero.getBoundingClientRect().top / (hero.offsetHeight - vh));

    // dónde cae el anillo con object-fit: cover (en apaisado se muestra más cielo)
    const sc = Math.max(vw / PHOTO.w, vh / PHOTO.h);
    const posY = vw > vh ? .3 : .5;
    bg.style.objectPosition = `50% ${posY * 100}%`;
    const ox = (vw - PHOTO.w * sc) / 2, oy = (vh - PHOTO.h * sc) * posY;
    const sx = ox + PHOTO.cx * sc, sy = oy + PHOTO.cy * sc, r0 = PHOTO.r * sc;

    // el anillo viaja al centro y crece
    const rEnd = Math.min(vw * .36, vh * .25);
    const z = ease(clamp((p - .06) / .64));
    const s = lerp(1, rEnd / r0, z);
    const cx = lerp(sx, vw / 2, z), cy = lerp(sy, vh * .44, z);
    bg.style.transform = `translate(${cx - sx * s}px, ${cy - sy * s}px) scale(${s})`;

    // todo lo que está afuera del anillo se vuelve sal
    const r = r0 * s;
    const fog = ease(clamp((p - .22) / .48));
    veil.style.background = `radial-gradient(circle at ${cx}px ${cy}px, rgba(243,244,241,0) ${r}px, rgba(243,244,241,${fog}) ${lerp(r * 3, r + 1, fog)}px)`;

    // una línea de cobre cierra el círculo
    const hr = r + 9, circ = 2 * Math.PI * hr, h = clamp((p - .6) / .25);
    halo.setAttribute("cx", cx); halo.setAttribute("cy", cy); halo.setAttribute("r", hr);
    halo.setAttribute("stroke-dasharray", circ); halo.setAttribute("stroke-dashoffset", circ * (1 - h));
    halo.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);

    const io = 1 - clamp(p / .14);
    intro.style.opacity = io; intro.style.transform = `translateY(${p * 80}px)`;
    intro.style.visibility = io <= 0 ? "hidden" : "visible";
    reveal.style.opacity = clamp((p - .74) / .16);
    reveal.style.top = `${cy + r + 30}px`;
  }

  /* cuenta regresiva */
  const el = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  let last = "";
  function countFrame(force) {
    const ms = Math.max(0, TARGET - Date.now());
    const sec = Math.floor(ms / 1000);
    const v = { d: Math.floor(sec / 86400), h: Math.floor(sec % 86400 / 3600), m: Math.floor(sec % 3600 / 60), s: sec % 60 };
    const key = lang + sec;
    if (key === last && !force) return;
    last = key;
    el("d").textContent = v.d; el("h").textContent = pad(v.h); el("m").textContent = pad(v.m); el("s").textContent = pad(v.s);
    for (const k of ["d", "h", "m", "s"]) el("u" + k).textContent = T[lang].units[k][v[k] === 1 ? 0 : 1];
    if (ms === 0) el("count").querySelector(".until").textContent = T[lang].done;
  }

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(new URLSearchParams(location.search).get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("de") ? "de" : "es"));

  function loop() { heroFrame(); countFrame(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
</script>
</body>
</html>
